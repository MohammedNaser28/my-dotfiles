<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper Curator</title>
<style>
  :root {
    --bg: #111115;
    --surface: #1a1a22;
    --border: #2a2a35;
    --border-hover: #3a3a48;
    --text: #d0d0d8;
    --text-dim: #707080;
    --accent: #7c9eff;
    --accent-hover: #6a8eef;
    --green: #6bb86b;
    --red: #d45;
    --yellow: #d9a;
    --orange: #f84;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
            background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .header h1 { font-size: 18px; font-weight: 600; margin-right: auto; }

  .stats { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
  .stats span { padding: 3px 10px; border-radius: 6px; background: var(--border);
                white-space: nowrap; }
  .stats .c-fit { border-left: 3px solid var(--green); }
  .stats .c-smaller { border-left: 3px solid var(--orange); }
  .stats .c-pending { border-left: 3px solid var(--text-dim); }
  .stats .c-keep { border-left: 3px solid var(--accent); }
  .stats .c-discard { border-left: 3px solid var(--red); }

  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls select, .controls input, .controls button {
    background: var(--border); color: var(--text); border: 1px solid transparent;
    padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; outline: none; }
  .controls select:hover, .controls input:hover, .controls button:hover { border-color: var(--border-hover); }
  .controls select:focus, .controls input:focus, .controls button:focus { border-color: var(--accent); }
  .controls button.primary { background: var(--accent); color: #000; font-weight: 600; }
  .controls button.primary:hover { background: var(--accent-hover); }
  .controls button.danger { background: var(--red); color: #fff; font-weight: 600; }
  .controls input { min-width: 160px; }

  .hint { padding: 6px 20px; font-size: 11px; color: var(--text-dim);
          border-bottom: 1px solid var(--border); background: var(--surface); }
  .hint kbd { background: var(--border); padding: 1px 5px; border-radius: 3px;
              font-family: inherit; font-size: 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
          gap: 10px; padding: 16px; }
  .card { position: relative; background: var(--surface); border-radius: 8px; overflow: hidden;
          cursor: pointer; border: 2px solid var(--border); transition: border-color .12s; }
  .card:hover { border-color: var(--accent); }
  .card img { width: 100%; aspect-ratio: 330/540; object-fit: cover; display: block; }
  .card .info { padding: 6px 8px; font-size: 11px; color: var(--text-dim); line-height: 1.4; }
  .card .info strong { color: var(--text); font-size: 11px; display: block; overflow: hidden;
                       text-overflow: ellipsis; white-space: nowrap; }
  .card .badge { position: absolute; top: 4px; right: 4px; padding: 2px 7px; border-radius: 4px;
                 font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .badge-pending { background: rgba(112,112,128,.65); color: #fff; }
  .badge-keep { background: rgba(108,158,255,.85); color: #000; }
  .badge-discard { background: rgba(221,68,85,.85); color: #fff; }
  .card .tier-tag { position: absolute; top: 4px; left: 4px; padding: 2px 6px; border-radius: 4px;
                    font-size: 9px; font-weight: 700; }
  .tier-fit { background: rgba(107,184,107,.8); color: #000; }
  .tier-smaller { background: rgba(255,136,68,.8); color: #000; }
  .tier-lowres { background: rgba(221,68,85,.8); color: #fff; }
  .tier-portrait { background: rgba(170,136,255,.8); color: #fff; }
  .tier-ultrawide { background: rgba(255,170,68,.8); color: #000; }
  .card .tag-list { position: absolute; bottom: 34px; left: 4px; right: 4px;
                    display: flex; gap: 3px; flex-wrap: wrap; }
  .card .tag-list span { background: rgba(108,158,255,.7); color: #000; padding: 1px 5px;
                         border-radius: 3px; font-size: 9px; font-weight: 600; }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }

  /* ─── Modal ─── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85);
                   z-index: 100; align-items: center; justify-content: center;
                   backdrop-filter: blur(4px); }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; max-width: 94vw; max-height: 92vh;
           overflow: hidden; display: flex; gap: 0; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .modal-img-wrap { position: relative; display: flex; align-items: center; justify-content: center;
                    min-width: 300px; }
  .modal-img-wrap img { max-width: 55vw; max-height: 85vh; object-fit: contain;
                        user-select: none; -webkit-user-drag: none; }
  .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,.5);
               color: #fff; border: none; font-size: 24px; width: 40px; height: 60px;
               cursor: pointer; border-radius: 8px; display: flex; align-items: center;
               justify-content: center; opacity: 0; transition: opacity .15s; }
  .modal-img-wrap:hover .modal-nav { opacity: .7; }
  .modal-nav:hover { opacity: 1 !important; background: rgba(0,0,0,.7); }
  .modal-nav.prev { left: 8px; }
  .modal-nav.next { right: 8px; }

  .modal-side { width: 340px; padding: 20px; display: flex; flex-direction: column; gap: 12px;
                overflow-y: auto; border-left: 1px solid var(--border); }
  .modal-side h2 { font-size: 14px; word-break: break-all; }
  .modal-pos { font-size: 11px; color: var(--text-dim); margin-bottom: -4px; }
  .modal-side .meta { font-size: 12px; color: var(--text-dim); line-height: 1.7; }
  .modal-side .meta b { color: var(--text); }

  .modal-side .actions { display: flex; flex-direction: column; gap: 6px; }
  .modal-side .actions .row { display: flex; gap: 6px; }
  .modal-side .actions .row button { flex: 1; }
  .modal-side .actions button { padding: 10px; border: none; border-radius: 8px;
                                font-size: 14px; font-weight: 600; cursor: pointer;
                                transition: filter .1s; }
  .modal-side .actions button:hover { filter: brightness(1.1); }
  .btn-keep { background: var(--accent); color: #000; }
  .btn-discard { background: var(--red); color: #fff; }
  .btn-tag { background: var(--border); color: var(--text); }
  .btn-pending { background: var(--border); color: var(--text); }

  .tag-section { border-top: 1px solid var(--border); padding-top: 12px; }
  .tag-section label { font-size: 11px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .tag-row { display: flex; gap: 6px; }
  .tag-row select { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                    padding: 8px; border-radius: 6px; font-size: 13px; outline: none; }
  .tag-row select:focus { border-color: var(--accent); }
  .tag-row button { background: var(--border); color: var(--text); border: none;
                    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 16px;
                    font-weight: 700; }
  .tag-row button:hover { background: var(--border-hover); }
  .current-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .current-tags span { background: rgba(108,158,255,.2); color: var(--accent);
                       padding: 2px 8px; border-radius: 4px; font-size: 11px;
                       display: flex; align-items: center; gap: 4px; }
  .current-tags .remove-tag { cursor: pointer; font-weight: 700; font-size: 14px;
                              color: var(--text-dim); }
  .current-tags .remove-tag:hover { color: var(--red); }

  @media (max-width: 800px) {
    .modal { flex-direction: column; }
    .modal-img-wrap img { max-width: 100%; max-height: 45vh; }
    .modal-side { width: 100%; border-left: none; border-top: 1px solid var(--border); }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🖼 Curator</h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <select id="filterTier" onchange="loadImages()">
      <option value="all">All tiers</option>
      <option value="fit">🟢 Fit</option>
      <option value="smaller">⚠ Smaller</option>
      <option value="portrait">🟡 Portrait</option>
      <option value="ultrawide">🟠 Ultrawide</option>
      <option value="lowres">🔴 Low Res</option>
    </select>
    <select id="filterDecision" onchange="loadImages()">
      <option value="all">All</option>
      <option value="pending">Pending</option>
      <option value="keep">Kept</option>
      <option value="discard">Discarded</option>
    </select>
    <input id="search" type="text" placeholder="Search file name…" oninput="loadImages()">
    <button onclick="batchAction('keep')" title="Keep all pending in current view">✓ Keep All</button>
    <button onclick="batchAction('discard')" title="Discard all pending in current view">✗ Discard</button>
    <button class="primary" onclick="organize()">📦 Organize</button>
  </div>
</div>

<div class="hint">
  <kbd>↑</kbd><kbd>↓</kbd> or <kbd>j</kbd><kbd>k</kbd> navigate grid ·
  <kbd>Enter</kbd> open detail ·
  <kbd>←</kbd><kbd>→</kbd> or <kbd>h</kbd><kbd>l</kbd> browse in modal ·
  <kbd>k</kbd> keep · <kbd>d</kbd> discard · <kbd>t</kbd> tag · <kbd>Esc</kbd> close
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No images match filters.</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-img-wrap">
      <button class="modal-nav prev" onclick="navImage(-1)">‹</button>
      <img id="modalImg" src="" alt="" onclick="navImage(1)">
      <button class="modal-nav next" onclick="navImage(1)">›</button>
    </div>
    <div class="modal-side">
      <div class="modal-pos" id="modalPos"></div>
      <h2 id="modalName"></h2>
      <div class="meta" id="modalMeta"></div>
      <div class="actions" id="modalActions"></div>
      <div class="tag-section">
        <label>Tags</label>
        <div class="current-tags" id="currentTags"></div>
        <div class="tag-row">
          <select id="modalTag" onchange="onTagSelect(this)">
            <option value="">+ Add tag…</option>
          </select>
          <button onclick="addCustomTag()" title="New custom tag">+</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let ALL_IMAGES = [];
let FILTERED_IMAGES = [];
let currentIdx = -1;
let currentRel = null;

async function loadImages() {
  const tier = document.getElementById('filterTier').value;
  const decision = document.getElementById('filterDecision').value;
  const q = document.getElementById('search').value;
  const res = await fetch(`/api/images?tier=${tier}&decision=${decision}&q=${encodeURIComponent(q)}`);
  const data = await res.json();
  ALL_IMAGES = data.images;
  FILTERED_IMAGES = ALL_IMAGES;
  renderGrid(FILTERED_IMAGES);
  renderStats(data.stats);
  document.getElementById('empty').style.display = FILTERED_IMAGES.length ? 'none' : 'block';
}

function renderGrid(images) {
  const grid = document.getElementById('grid');
  grid.innerHTML = images.map((img, i) => {
    const tc = `tier-${img.tier}`;
    const bc = `badge-${img.decision}`;
    const dl = img.decision === 'keep' ? 'Kept' : img.decision === 'discard' ? 'Discarded' : '';
    const tl = img.tags.map(t => `<span>${escHtml(t)}</span>`).join('');
    return `<div class="card" data-idx="${i}" onclick="openModal(${i})">
      <img src="${img.thumbnail}" alt="${escHtml(img.rel)}" loading="lazy">
      <span class="tier-tag ${tc}">${img.tier}</span>
      ${dl ? `<span class="badge ${bc}">${dl}</span>` : ''}
      ${tl ? `<div class="tag-list">${tl}</div>` : ''}
      <div class="info">
        <strong>${escHtml(basename(img.rel))}</strong>
        ${img.width}×${img.height} · ${fmtSize(img.size_bytes)}
      </div>
    </div>`;
  }).join('');

  // Focus management
  const focused = grid.querySelector('.focused');
  if (!focused && grid.firstChild) grid.firstChild.classList.add('focused');
}

function renderStats(s) {
  if (!s) return;
  document.getElementById('stats').innerHTML = `
    <span class="c-fit">🟢 ${s.fit}</span>
    <span class="c-smaller">⚠ ${s.smaller}</span>
    <span>🟡 ${s.portrait}</span>
    <span>🟠 ${s.ultrawide}</span>
    <span>🔴 ${s.lowres}</span>
    <span class="c-keep">✓ ${s.kept}</span>
    <span class="c-discard">✗ ${s.discarded}</span>
    <span class="c-pending">○ ${s.pending}</span>
  `;
}

// ─── Modal ───

async function openModal(idx) {
  if (idx < 0 || idx >= FILTERED_IMAGES.length) return;
  currentIdx = idx;
  const img = FILTERED_IMAGES[idx];
  currentRel = img.rel;

  document.getElementById('modalImg').src = `/api/image/${encodeURI(img.rel)}`;
  document.getElementById('modalName').textContent = basename(img.rel);
  document.getElementById('modalPos').textContent = `${idx + 1} / ${FILTERED_IMAGES.length}`;
  document.getElementById('modalMeta').innerHTML = `
    <b>Path:</b> ${escHtml(img.rel)}<br>
    <b>Resolution:</b> ${img.width}×${img.height}<br>
    <b>Size:</b> ${fmtSize(img.size_bytes)}<br>
    <b>Format:</b> ${img.format}<br>
    <b>Tier:</b> ${img.tier} &middot; <b>Decision:</b> ${img.decision}
  `;

  updateModalActions(img.decision);
  updateTagDropdown(img.rel);
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  currentIdx = -1;
  currentRel = null;
  loadImages();
}

function navImage(dir) {
  openModal(currentIdx + dir);
}

async function decide(decision) {
  if (!currentRel) return;
  await fetch('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rel: currentRel, decision})
  });
  if (FILTERED_IMAGES[currentIdx]) {
    FILTERED_IMAGES[currentIdx].decision = decision;
  }
  updateModalActions(decision);
  renderGrid(FILTERED_IMAGES);
  loadImages();
}

function updateModalActions(decision) {
  document.getElementById('modalActions').innerHTML = `
    <div class="row">
      <button class="btn-keep" onclick="decide('keep')" ${decision === 'keep' ? 'style="filter:brightness(1.3)"' : ''}>✓ Keep</button>
      <button class="btn-discard" onclick="decide('discard')" ${decision === 'discard' ? 'style="filter:brightness(1.3)"' : ''}>✗ Discard</button>
      <button class="btn-pending" onclick="decide('pending')" ${decision === 'pending' ? 'style="filter:brightness(1.3)"' : ''}>○ Reset</button>
    </div>
  `;
}

// ─── Tags ───

async function updateTagDropdown(rel) {
  const sel = document.getElementById('modalTag');
  sel.innerHTML = '<option value="">+ Add tag…</option>';

  const [tagsRes, imgData] = await Promise.all([
    fetch('/api/tags'),
    fetch(`/api/images?q=${encodeURIComponent(rel)}`).then(r => r.json()),
  ]);
  const presetTags = await tagsRes.json();
  const img = imgData.images.find(i => i.rel === rel);
  const currentTags = img ? img.tags : [];

  // Show current tags
  const ct = document.getElementById('currentTags');
  ct.innerHTML = currentTags.map(t =>
    `<span>${escHtml(t)} <span class="remove-tag" onclick="removeTag('${escHtml(t)}')">×</span></span>`
  ).join('');

  // Populate dropdown: unused presets + custom
  let hasCustom = false;
  presetTags.forEach(t => {
    if (!currentTags.includes(t)) {
      sel.innerHTML += `<option value="${escHtml(t)}">${escHtml(t)}</option>`;
    } else {
      hasCustom = true;
    }
  });
  // Add custom tags that aren't in presets
  currentTags.forEach(t => {
    if (!presetTags.includes(t)) {
      sel.innerHTML += `<option value="${escHtml(t)}">${escHtml(t)}</option>`;
    }
  });
  sel.innerHTML += `<option value="__custom__">── Custom ──</option>`;
}

async function onTagSelect(sel) {
  let tag = sel.value;
  if (!tag) return;
  if (tag === '__custom__') {
    addCustomTag();
    return;
  }
  sel.value = '';
  await tagImage(currentRel, tag);
}

async function addCustomTag() {
  const tag = prompt('Enter new tag name:');
  if (!tag || !tag.trim()) return;
  await tagImage(currentRel, tag.trim());
}

async function tagImage(rel, tag) {
  await fetch('/api/decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rel, decision: 'keep', tag})
  });
  updateTagDropdown(rel);
  loadImages();
}

async function removeTag(tag) {
  // Remove by re-deciding without the tag
  // The backend doesn't support tag removal directly, so we get current tags then remove
  const res = await fetch(`/api/images?q=${encodeURIComponent(currentRel)}`);
  const data = await res.json();
  const img = data.images.find(i => i.rel === currentRel);
  const remaining = (img.tags || []).filter(t => t !== tag);
  // Update by deciding keep with the new tag list
  // Actually, the API only adds tags. Need a way to replace.
  // For now, just keep without the tag
  await fetch('/api/tag-replace', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rel: currentRel, tags: remaining})
  });
  updateTagDropdown(currentRel);
  loadImages();
}

// ─── Batch ───

async function batchAction(decision) {
  const tier = document.getElementById('filterTier').value;
  const count = FILTERED_IMAGES.filter(i => i.decision === 'pending').length;
  if (count === 0) return;
  if (!confirm(`${decision === 'keep' ? 'Keep' : 'Discard'} ${count} pending images?`)) return;
  await fetch('/api/batch-decide', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({decision, tier})
  });
  loadImages();
}

async function organize() {
  const btn = document.querySelector('.controls .primary');
  btn.textContent = '⏳';
  btn.disabled = true;
  const res = await fetch('/api/organize', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: '{}'
  });
  const d = await res.json();
  btn.textContent = '📦 Organize';
  btn.disabled = false;
  if (d.ok) {
    const details = Object.entries(d.theme_counts || {}).map(([t,c]) => `  ${t}: ${c}`).join('\n');
    alert(`Organized ${d.copied} images.\n${details}`);
  }
}

// ─── Keyboard Navigation ───

document.addEventListener('keydown', e => {
  const modalOpen = document.getElementById('modal').classList.contains('show');

  if (e.key === 'Escape' && modalOpen) { closeModal(); e.preventDefault(); return; }

  if (modalOpen) {
    switch (e.key) {
      case 'ArrowLeft': case 'h': navImage(-1); e.preventDefault(); break;
      case 'ArrowRight': case 'l': navImage(1); e.preventDefault(); break;
      case 'k': decide('keep'); e.preventDefault(); break;
      case 'd': decide('discard'); e.preventDefault(); break;
      case 't': document.getElementById('modalTag').focus(); e.preventDefault(); break;
    }
    return;
  }

  // Grid navigation
  const cards = document.querySelectorAll('.card');
  if (!cards.length) return;
  let focusedIdx = -1;
  cards.forEach((c, i) => { if (c.classList.contains('focused')) focusedIdx = i; });

  switch (e.key) {
    case 'ArrowDown': case 'j':
      focusedIdx = Math.min(focusedIdx + 1, cards.length - 1);
      break;
    case 'ArrowUp': case 'k':
      focusedIdx = Math.max(focusedIdx - 1, 0);
      break;
    case 'Enter':
      if (focusedIdx >= 0) { openModal(focusedIdx); e.preventDefault(); }
      return;
    default: return;
  }

  cards.forEach(c => c.classList.remove('focused'));
  cards[focusedIdx].classList.add('focused');
  cards[focusedIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  e.preventDefault();
});

// ─── Helpers ───

function basename(p) { return p.split('/').pop() || p; }
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function fmtSize(b) {
  if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
  if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
  return b + ' B';
}

loadImages();
setInterval(loadImages, 10000);
</script>
</body>
</html>
